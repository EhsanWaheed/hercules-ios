name: OV10
# Level code overlay, loaded above ENGINE3 (base from the jal targets that land on
# function prologues; OV10 has no internal calls, base taken from OV2/OV8).
options:
  basename: ov10
  target_path: files/OV/OV10.
  elf_path: build/ov10.elf
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov10
  src_path: src/ov10
  build_path: build
  asset_path: assets/ov10

  ld_script_path: build/ov10.ld
  find_file_boundaries: True

  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.main.txt
    - config/symbol_addrs.engine3.txt
    - config/symbol_addrs.ov10.txt
  reloc_addrs_path:
    - config/reloc_addrs.ov10.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.ov10.txt
  undefined_syms_auto_path: config/undefined_syms_auto.ov10.txt

  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: ov10
    type: code
    start: 0x0
    vram: 0x800684A0
    subsegments:
      - [0x0, rodata]
      - [0x120, asm]
      - [0x616c, data]
  - [0xb5fc]
