name: ENGINE3
options:
  basename: engine3
  target_path: files/EX/ENGINE3.
  elf_path: build/engine3.elf
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm/engine3
  src_path: src/engine3
  build_path: build
  asset_path: assets/engine3

  ld_script_path: build/engine3.ld
  find_file_boundaries: True

  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]

  # Boot executable symbols: the engine calls PsyQ code resident in SCES_008.93.
  symbol_addrs_path:
    - config/symbol_addrs.main.txt
    - config/symbol_addrs.engine3.txt
  reloc_addrs_path:
    - config/reloc_addrs.engine3.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.engine3.txt
  undefined_syms_auto_path: config/undefined_syms_auto.engine3.txt

  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: header
    type: header
    start: 0x0
  - name: engine3
    type: code
    start: 0x800
    vram: 0x80038350
    subsegments:
      - [0x800, asm]
      - [0x29b28, data]
  - [0x30800]
