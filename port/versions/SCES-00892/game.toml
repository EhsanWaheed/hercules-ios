# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Hercules"
id = "SCES-00892"
players = 1
exe = "disc/SCES_008.92"
# relative to the game folder: put your Redump dump (cue + bin) into disc/
disc = "disc/Disney's Hercules (France).cue"
load_address = "0x80010000"
entry_pc = "0x80013710"
text_size = "0x0001F000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Disney's Hercules (France).bin"
cue_name = "Disney's Hercules (France).cue"
boot_exe = "SCES_008.92"
known_sizes = [395006640]
known_md5 = [
  "816a41623a171a7e48eda5ce2c45a844",
]
known_sha1 = [
  "ae5033f689f9c3844e4c8aecbabaa48f4fc709bd",
]
known_crc32 = [
  "4ec6ac43",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Mod hooks the AOT overlay code must call (regenerate static after changes):
# hercules.hd-sprites (mods/src/hercules_hd_sprites.c): sprite cache hooks in
# ENGINE1 / ENGINE3 / TITLE; hercules.widescreen (mods/src/hercules_widescreen.c):
# HUD sprite helper tag stores 0x8004A050 (ENGINE1) and 0x80046E04 (ENGINE3),
# backdrop column loop in func_8003D348 (ENGINE1) / func_8003C214 (ENGINE3),
# panorama sky builders in OV2 / OV8 / OV9.
mod_function_entry_funcs = ["0x80040240", "0x8003F650", "0x8005464C", "0x800688F0", "0x800687C8", "0x800753C0"]
mod_instruction_sites = ["0x8003FD80", "0x8003F190", "0x8005418C", "0x8004A054", "0x80046E08", "0x8003D3B4", "0x8003D424", "0x8003D4B0", "0x8003D5F8", "0x8003C280", "0x8003C2F0", "0x8003C37C", "0x8003C4C4"]

[runtime]
window_title = "Hercules Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
internal_resolution = "1080p"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1

# Widescreen probe (mod hercules.widescreen requests 16:9): frames that use
# the GTE count as gameplay, so native-wide margins engage in levels while
# menus and FMV stay 4:3. Culls are not widened yet.
[widescreen]
gte_game_mode = true

# Landscape column window (native-wide). Each layer draws columns outward from
# the camera until a tile's projected anchor leaves the screen; these tests
# decide that, so widening them lets every layer fill the 16:9 margins.
# Identity at 4:3 (margin 0). ENGINE1 and ENGINE3 load at the same base; a
# listed address holding another instruction kind in the other file is left
# vanilla by the generator.
[widescreen.cull]
# ENGINE1 func_80045F90 / func_800464DC: lhu SX; sltiu v0,v0,0x141 (0..320)
# + objects (issue #4): the sprite drawers ENGINE1 func_8003E5D8 / ENGINE3
#   func_8003D9B8 draw an object at once while its x is 0..320 (sltiu 0x141),
#   else only if its frame's box still reaches the screen (ENGINE1
#   func_8004495C / ENGINE3 func_80041584: right edge < 0 -> bltz below, left
#   edge > 320 -> slti 0x141 below). Widened, objects in the 16:9 margins are
#   drawn instead of appearing once they reach the 4:3 picture.
screen_x_sites = ["0x800461C4", "0x80046854", "0x8003E6CC", "0x8003DAAC"]
# ENGINE1 rotated path (slti SX,0x141) and ENGINE3 func_80042EB0 /
# func_80043148 / func_80044480 right edges (0x141, 0x161)
slti_sites = ["0x80046264", "0x80042FE8", "0x800432C8", "0x800445EC", "0x80042FB8", "0x80042FCC", "0x80043298", "0x800432AC", "0x800445BC", "0x800445D0", "0x80044AD4", "0x800416FC"]
# ENGINE3 left edges: slti v0,v0,-0x20
slti_lower_sites = ["0x80043000", "0x800432E0", "0x80044604"]
# left edges as `bgez SX, keep`: ENGINE1 rotated path, ENGINE3 dir 1
bgez_sites = ["0x80046280", "0x80042FB4", "0x80043294", "0x800445B8"]
# objects' right edge (frame box): `bltz x + right, offscreen` (see screen_x_sites)
bltz_sites = ["0x80044AB4", "0x800416DC"]
