format_version = 5
id = "hercules.skip-intro"
version = "1.0.0"
name = "Skip Intro"
author = "hercules decomp"
description = "Goes straight from boot to the LADEN screen and the title menu: skips the piracy notice, the SCEE screen, the three intro movies and, optionally, the memory card check."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCES-00893"

[[feature]]
id = "skip-intro"
name = "Skip intro screens"
description = "Skips the piracy notice, SCEE screen and intro movies on a cold boot."
group = "Gameplay"
default_enabled = false

[[feature]]
id = "skip-memcard"
name = "Skip memory card check"
description = "Skips the 'Bitte warten ... die Memory Card wird überprüft' screen."
group = "Gameplay"
default_enabled = false

[[feature]]
id = "direct-start"
name = "Start a new game directly"
description = "Skips the title menu: a cold boot goes straight to the chosen level's story movie, intro screen and level (the launcher is the menu)."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "direct-start"
id = "level"
label = "Level"
description = "Level the new game starts in (4 plays as 5, as in the game)."
type = "choice"
default = "1"

[[option.choice]]
value = "1"
label = "Level 1"

[[option.choice]]
value = "2"
label = "Level 2"

[[option.choice]]
value = "3"
label = "Level 3"

[[option.choice]]
value = "4"
label = "Level 4"

[[option.choice]]
value = "5"
label = "Level 5"

[[option.choice]]
value = "6"
label = "Level 6"

[[option.choice]]
value = "7"
label = "Level 7"

[[option.choice]]
value = "8"
label = "Level 8"

[[option.choice]]
value = "9"
label = "Level 9"

[[option.choice]]
value = "10"
label = "Level 10"

[[option.choice]]
value = "11"
label = "Level 11"

[[plugin]]
feature = "skip-intro"
id = "hercules.skip-intro"

[[plugin]]
feature = "skip-memcard"
id = "hercules.skip-memcard"

[[plugin]]
feature = "direct-start"
id = "hercules.direct-start"
